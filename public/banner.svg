<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>

  <g transform="translate(96,64)">
    <rect width="56" height="56" rx="13" fill="url(#bar)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 14 L28 42"/>
      <path d="M28 20 L17 20"/>
      <path d="M28 28 L39 28"/>
      <path d="M28 36 L19 36"/>
    </g>
    <circle cx="39" cy="20" r="3.4" fill="#FFFFFF"/>
    <circle cx="17" cy="36" r="3.4" fill="#FFFFFF"/>
  </g>

  <text x="180" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    Assetrix
  </text>
  <text x="182" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#7DD3FC" letter-spacing="4">
    ENTERPRISE ASSET INTELLIGENCE PLATFORM
  </text>

  <g transform="translate(620,58)" filter="url(#glow)">
    <rect width="150" height="80" rx="12" fill="none" stroke="#0891B2" stroke-width="2" opacity="0.9"/>
    <text x="75" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#67E8F9" letter-spacing="2">TRACK</text>
    <text x="75" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#FFFFFF">Assets</text>
  </g>
  <g transform="translate(800,58)" filter="url(#glow)">
    <rect width="150" height="80" rx="12" fill="none" stroke="#0891B2" stroke-width="2" opacity="0.9"/>
    <text x="75" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#67E8F9" letter-spacing="2">AUTOMATE</text>
    <text x="75" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#FFFFFF">Maintenance</text>
  </g>
  <g transform="translate(980,58)" filter="url(#glow)">
    <rect width="150" height="80" rx="12" fill="none" stroke="#0891B2" stroke-width="2" opacity="0.9"/>
    <text x="75" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#67E8F9" letter-spacing="2">OPTIMIZE</text>
    <text x="75" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#FFFFFF">Allocations</text>
  </g>

  <g transform="translate(120,200)">
    <g font-family="Consolas, monospace" font-size="14">
      <text x="0" y="0" fill="#5EEAD4">&#9553; REGISTRATION</text>
      <text x="160" y="0" fill="#22D3EE">&#9654;</text>
      <text x="190" y="0" fill="#5EEAD4">ALLOCATION</text>
      <text x="330" y="0" fill="#22D3EE">&#9654;</text>
      <text x="360" y="0" fill="#5EEAD4">MAINTENANCE</text>
      <text x="510" y="0" fill="#22D3EE">&#9654;</text>
      <text x="540" y="0" fill="#5EEAD4">AUDIT</text>
      <text x="640" y="0" fill="#22D3EE">&#9654;</text>
      <text x="670" y="0" fill="#5EEAD4">ANALYTICS</text>
      <text x="810" y="0" fill="#22D3EE">&#9654;</text>
      <text x="840" y="0" fill="#5EEAD4">INTELLIGENCE</text>
    </g>
    <rect x="0" y="-22" width="1010" height="40" rx="8" fill="#0B1220" opacity="0.6"/>
    <line x1="0" y1="8" x2="1010" y2="8" stroke="#0891B2" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="120" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94A3B8">
    Track assets · Eliminate conflicts · Automate workflows · Audit compliance · Decide with data
  </text>
  <text x="120" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">
    Next.js 16 · React 19 · TypeScript 5 · Tailwind v4 · Express 4 · Prisma 6 · PostgreSQL · Redis · BullMQ
  </text>
</svg>
